<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="assets/Logo.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Edit Player</title>
<style>
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_light.woff2') format('woff2'),url('assets/fonts/pt-root-ui_light.woff') format('woff');font-weight:300;}
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_regular.woff2') format('woff2'),url('assets/fonts/pt-root-ui_regular.woff') format('woff');font-weight:400;}
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_medium.woff2') format('woff2'),url('assets/fonts/pt-root-ui_medium.woff') format('woff');font-weight:500;}
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_bold.woff2') format('woff2'),url('assets/fonts/pt-root-ui_bold.woff') format('woff');font-weight:700;}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }

body {
  background: #F7F7F7;
  font-family: 'PT Root UI', sans-serif;
  -webkit-font-smoothing: antialiased;
  color: #1F1F1F;
  padding-bottom: 60px;
}

/* ── Header ── */
.header {
  height: 64px; background: #FFFFFF; border-bottom: 1px solid #EDEDED;
  display: flex; align-items: center; justify-content: center; position: relative;
}
.header img.logo { display: block; width: 40px; height: 40px; }
.nav-back {
  position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
  display: inline-flex; align-items: center; gap: 6px;
  background: #F7F7F7; border: none; border-radius: 12px;
  padding: 8px 14px 8px 10px;
  font-family: inherit; font-size: 14px; font-weight: 500; color: #1F1F1F;
  text-decoration: none; cursor: pointer; transition: background 0.15s;
}
.nav-back:hover { background: #EDEDED; }

/* ── Wrap ── */
.wrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 0; }

/* ── Page head ── */
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
.head-icon {
  width: 40px; height: 40px; border-radius: 12px; background: #1A1A1A;
  display: grid; place-items: center; flex: none;
}
.head-icon img { width: 24px; height: 24px; display: block; }
.page-title { font-size: 22px; font-weight: 700; color: #1F1F1F; letter-spacing: -0.3px; }
.page-sub { font-size: 12px; color: #AAAAAA; font-weight: 500; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }

/* ── Two-column form ── */
.form-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }

/* ── Field ── */
.field { margin-bottom: 20px; }
.field-label {
  display: block; font-size: 11px; font-weight: 600; color: #AAAAAA;
  text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px;
}

/* ── Segmented toggle ── */
.seg { display: flex; gap: 4px; background: #F0F0F0; border-radius: 16px; padding: 4px; }
.seg-btn {
  flex: 1; height: 40px; border: none; border-radius: 12px;
  background: transparent; color: #666666;
  font-family: inherit; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: background 0.13s, color 0.13s; white-space: nowrap;
}
.seg-btn:hover:not(.active):not(:disabled) { color: #1F1F1F; }
.seg-btn.active { background: #1A1A1A; color: #FFFFFF; }
.seg-btn:disabled { opacity: 0.5; cursor: default; }

/* ── Text input ── */
.f-input {
  width: 100%; height: 48px;
  background: #F0F0F0; border: 1.5px solid transparent; border-radius: 16px;
  padding: 0 16px;
  font-family: inherit; font-size: 15px; font-weight: 500; color: #1F1F1F;
  outline: none; transition: border-color 0.15s, background 0.15s;
}
.f-input::placeholder { color: #BBBBBB; }
.f-input:focus { background: #FFFFFF; border-color: #F74A96; }
.f-input:disabled { opacity: 0.5; cursor: default; }

/* ── Racket group ── */
.racket-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.racket-head span { font-size: 11px; font-weight: 600; color: #AAAAAA; text-transform: uppercase; letter-spacing: 0.07em; }
.racket-group { display: flex; flex-direction: column; gap: 8px; }

/* ── Form footer ── */
.form-footer { display: flex; gap: 12px; align-items: center; margin-top: 36px; }
.btn-primary {
  height: 52px; padding: 0 28px; border: none; border-radius: 16px;
  background: #1A1A1A; color: #FFFFFF;
  font-family: inherit; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: background 0.15s;
}
.btn-primary:hover { background: #333333; }
.btn-cancel {
  height: 52px; padding: 0 24px; border-radius: 16px;
  border: 1.5px solid #F74A96; background: #FFFFFF; color: #F74A96;
  font-family: inherit; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: background 0.15s;
}
.btn-cancel:hover { background: #FFF0F7; }
.btn-delete {
  height: 52px; padding: 0 24px; border: none; border-radius: 16px;
  background: #F26B3A; color: #FFFFFF;
  font-family: inherit; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: background 0.15s; margin-left: auto;
}
.btn-delete:hover { background: #E05A2A; }

/* ── Delete modal ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(20,20,20,0.42);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay[hidden] { display: none; }
.modal {
  background: #FFFFFF; border-radius: 24px; padding: 28px 24px 24px;
  width: 360px; max-width: 100%; box-shadow: 0 8px 40px rgba(0,0,0,0.18);
}
.modal h3 { margin: 0 0 8px; font-size: 20px; font-weight: 700; color: #1F1F1F; }
.modal p  { margin: 0 0 24px; font-size: 14px; line-height: 1.6; color: #666666; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions button {
  flex: 1; height: 48px; border: none; border-radius: 20px;
  font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s;
}
.modal-cancel { background: #F0F0F0; color: #1F1F1F; }
.modal-cancel:hover { background: #E6E6E6; }
.modal-danger { background: #F26B3A; color: #FFFFFF; }
.modal-danger:hover { background: #E05A2A; }
</style>
</head>
<body>

<header class="header">
  <a class="nav-back" href="players.html">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back
  </a>
  <img class="logo" src="assets/Logo.svg" alt="" />
</header>

<div class="wrap">
  <div class="page-head">
    <div class="head-icon"><img src="assets/icon-players.svg" alt="" /></div>
    <div>
      <div class="page-title" id="player-name">Loading…</div>
      <div class="page-sub">Edit player</div>
    </div>
  </div>

  <div class="form-cols">
    <!-- Left column -->
    <div>
      <div class="field">
        <label class="field-label">Sex</label>
        <div class="seg" id="seg-gender">
          <button class="seg-btn active" data-val="m">Man</button>
          <button class="seg-btn" data-val="f">Women</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Playing hand</label>
        <div class="seg" id="seg-hand">
          <button class="seg-btn active" data-val="right">Right</button>
          <button class="seg-btn" data-val="left">Left</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="f-first">First name</label>
        <input class="f-input" id="f-first" type="text" maxlength="30" placeholder="First name" autocomplete="off" />
      </div>
      <div class="field">
        <label class="field-label" for="f-last">Last name</label>
        <input class="f-input" id="f-last" type="text" maxlength="30" placeholder="Last name" autocomplete="off" />
      </div>
      <div class="field">
        <label class="field-label" for="f-birth">Birthday</label>
        <input class="f-input" id="f-birth" type="text" inputmode="numeric" maxlength="10" placeholder="DD.MM.YYYY" />
      </div>
    </div>

    <!-- Right column -->
    <div>
      <div class="field">
        <label class="field-label">Status</label>
        <div class="seg" id="seg-status">
          <button class="seg-btn" data-val="Regular">Regular</button>
          <button class="seg-btn active" data-val="Newcomer">Newcomer</button>
          <button class="seg-btn" data-val="Archive">Archive</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="f-rating">Rating</label>
        <input class="f-input" id="f-rating" type="text" inputmode="numeric" maxlength="4" placeholder="e.g. 100" />
      </div>
      <div class="field">
        <div class="racket-head">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><g clip-path="url(#rc)"><path d="M2.297 2.43C4.428.299 8.355.707 10.573 3.443c2.975 3.671 1.195 4.645-.711 6.551-1.906 1.906-2.88 3.686-6.55.711C.574 8.488.167 4.56 2.297 2.43Z" fill="#AAAAAA"/><path d="M10.334 10.465c.335-.335.726-.698 1.068-1.039-.022.396.033.799.278 1.043 1.344 1.345 3.268 2.834 3.283 2.846l-1.751 1.751c-.018-.023-1.504-1.942-2.846-3.284-.245-.244-.648-.299-1.044-.277.333-.33.684-.708 1.012-1.04Z" fill="#AAAAAA"/></g><defs><clipPath id="rc"><rect width="16" height="16" fill="white" transform="matrix(-1 0 0 1 16 0)"/></clipPath></defs></svg>
          <span>Racket</span>
        </div>
        <div class="racket-group">
          <input class="f-input" id="f-blade" type="text" maxlength="60" placeholder="Blade" autocomplete="off" />
          <input class="f-input" id="f-fh"    type="text" maxlength="60" placeholder="Right rubber" autocomplete="off" />
          <input class="f-input" id="f-bh"    type="text" maxlength="60" placeholder="Left rubber" autocomplete="off" />
        </div>
      </div>
    </div>
  </div>

  <div class="form-footer">
    <button class="btn-primary" id="save-btn">Save</button>
    <button class="btn-cancel"  id="cancel-btn">Cancel</button>
    <button class="btn-delete"  id="delete-btn">Delete player</button>
  </div>
</div>

<div class="modal-overlay" id="delete-modal" hidden>
  <div class="modal">
    <h3>Delete player?</h3>
    <p>This player will be permanently removed from the roster.</p>
    <div class="modal-actions">
      <button class="modal-cancel" id="del-cancel" type="button">Cancel</button>
      <button class="modal-danger" id="del-confirm" type="button">Delete</button>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
  const editId = new URLSearchParams(location.search).get('id');
  if (!editId) window.location.href = 'players.html';

  // ── Segmented toggle helper ───────────────────────────────────────────────────
  function wireSeg(id) {
    const seg = document.getElementById(id);
    seg.addEventListener('click', e => {
      const b = e.target.closest('.seg-btn');
      if (!b || b.disabled) return;
      seg.querySelectorAll('.seg-btn').forEach(x => x.classList.toggle('active', x === b));
    });
    return () => (seg.querySelector('.seg-btn.active') || seg.querySelector('.seg-btn')).dataset.val;
  }
  function setSeg(id, val) {
    document.querySelectorAll('#' + id + ' .seg-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.val === val));
  }

  const getGender = wireSeg('seg-gender');
  const getHand   = wireSeg('seg-hand');
  const getStatus = wireSeg('seg-status');
  function val(id) { return document.getElementById(id).value.trim(); }

  // ── Birth date auto-format ────────────────────────────────────────────────────
  const birthEl = document.getElementById('f-birth');
  birthEl.addEventListener('input', () => {
    let d = birthEl.value.replace(/[^0-9]/g, '').slice(0, 8);
    let out = d.slice(0, 2);
    if (d.length > 2) out += '.' + d.slice(2, 4);
    if (d.length > 4) out += '.' + d.slice(4, 8);
    birthEl.value = out;
  });

  // ── Rating: numeric only ──────────────────────────────────────────────────────
  const ratingEl = document.getElementById('f-rating');
  ratingEl.addEventListener('input', () => {
    ratingEl.value = ratingEl.value.replace(/[^0-9]/g, '').slice(0, 4);
  });

  // ── Load player ───────────────────────────────────────────────────────────────
  async function init() {
    const [p, me] = await Promise.all([
      API.getPlayer(editId, { ungated: true }),
      fetch('/api/me').then(r => r.json()),
    ]);
    if (!p) { window.location.href = 'players.html'; return; }

    document.title = p.name || 'Edit Player';
    document.getElementById('player-name').textContent = p.name || '—';

    document.getElementById('f-first').value  = p.firstName || '';
    document.getElementById('f-last').value   = p.lastName  || '';
    document.getElementById('f-birth').value  = p.birth     || '';
    document.getElementById('f-rating').value = p.rating != null ? p.rating : '';
    document.getElementById('f-blade').value  = p.blade     || '';
    document.getElementById('f-fh').value     = p.forehand  || '';
    document.getElementById('f-bh').value     = p.backhand  || '';

    if (p.gender) setSeg('seg-gender', p.gender);
    if (p.hand)   setSeg('seg-hand',   p.hand);
    if (p.status) setSeg('seg-status', p.status);

    if (me.role === 'guest') {
      document.querySelectorAll('.f-input').forEach(el => { el.disabled = true; });
      document.querySelectorAll('.seg-btn').forEach(el => { el.disabled = true; });
      document.getElementById('save-btn').style.display   = 'none';
      document.getElementById('delete-btn').style.display = 'none';
      document.getElementById('cancel-btn').textContent   = 'Back';
    }
  }

  // ── Save ──────────────────────────────────────────────────────────────────────
  document.getElementById('save-btn').addEventListener('click', async () => {
    const first = val('f-first'), last = val('f-last');
    if (!first && !last) {
      const el = document.getElementById('f-last');
      el.focus(); el.style.borderColor = '#F74A96';
      return;
    }
    const rt = val('f-rating');
    await API.savePlayer({
      id: editId,
      name: [last, first].filter(Boolean).join(' '),
      firstName: first, lastName: last,
      birth: val('f-birth'),
      gender: getGender(),
      hand: getHand(),
      status: getStatus(),
      rating: rt === '' ? null : parseInt(rt, 10),
      blade: val('f-blade'),
      forehand: val('f-fh'),
      backhand: val('f-bh'),
    });
    window.location.href = 'players.html';
  });

  // ── Cancel ────────────────────────────────────────────────────────────────────
  document.getElementById('cancel-btn').addEventListener('click', () => {
    window.location.href = 'players.html';
  });

  // ── Delete ────────────────────────────────────────────────────────────────────
  const deleteModal = document.getElementById('delete-modal');
  document.getElementById('delete-btn').addEventListener('click', () => { deleteModal.hidden = false; });
  document.getElementById('del-cancel').addEventListener('click', () => { deleteModal.hidden = true; });
  deleteModal.addEventListener('click', e => { if (e.target === deleteModal) deleteModal.hidden = true; });
  document.getElementById('del-confirm').addEventListener('click', async () => {
    await API.deletePlayer(editId);
    window.location.href = 'players.html';
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !deleteModal.hidden) deleteModal.hidden = true;
  });

  init();
</script>
</body>
</html>
