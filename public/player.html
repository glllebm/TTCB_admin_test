<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" href="assets/Logo.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Edit Player — TTCB Admin</title>
<style>
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_light.woff2') format('woff2'),url('assets/fonts/pt-root-ui_light.woff') format('woff');font-weight:300;}
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_regular.woff2') format('woff2'),url('assets/fonts/pt-root-ui_medium.woff') format('woff');font-weight:500;}
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_bold.woff2') format('woff2'),url('assets/fonts/pt-root-ui_bold.woff') format('woff');font-weight:700;}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; background: #F7F7F7; font-family: 'PT Root UI', sans-serif; -webkit-font-smoothing: antialiased; }
input::placeholder { color: #BBBBBB; }

/* ─── Shell ─── */
.shell {
  height: 100vh; width: 100%; max-width: 100vw;
  padding: 12px; gap: 12px;
  display: flex; align-items: flex-start;
  overflow: hidden; box-sizing: border-box;
}

/* ─── Left Frame ─── */
.lf { width: 251px; flex: none; height: 100%; display: flex; flex-direction: column; gap: 12px; }
.logo-head {
  width: 251px; height: 64px; flex: none;
  background: #FFFFFF; border-radius: 24px;
  padding: 12px 24px;
  display: flex; align-items: center; gap: 12px;
}
.logo-head img { width: 32px; height: 32px; display: block; flex: none; }
.logo-wordmark { font-size: 20px; font-weight: 700; color: #1F1F1F; white-space: nowrap; }
.nav-panel {
  flex: 1; background: #FFFFFF; border-radius: 24px;
  padding: 12px; display: flex; flex-direction: column; min-height: 0;
}
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 12px;
  font-family: 'PT Root UI', sans-serif; font-size: 16px; font-weight: 500; color: #333333;
  text-decoration: none; border: none; background: transparent;
  cursor: pointer; width: 100%; transition: background 0.12s;
}
.nav-item:hover { background: #F7F7F7; }
.nav-item.active { background: #F0F0F0; }
.nav-item img { width: 24px; height: 24px; display: block; flex: none; }

/* ─── Right Frame ─── */
.rf {
  flex: 1; min-width: 0; height: 100%;
  display: flex; flex-direction: column; gap: 12px;
  overflow: hidden;
}

/* ─── Head of section ─── */
.form-hdr {
  flex: none; height: 64px;
  background: #FFFFFF; border-radius: 24px;
  padding: 12px 24px;
  display: flex; align-items: center;
}
.form-title-frame { display: flex; align-items: center; gap: 12px; }
.form-icon {
  width: 36px; height: 36px; flex: none;
  background: #2A2A2A; border-radius: 12px; padding: 6px;
  display: flex; align-items: center; justify-content: center;
}
.form-icon img { width: 24px; height: 24px; display: block; filter: brightness(0) invert(1); }
.form-title { font-size: 20px; font-weight: 700; color: #1F1F1F; letter-spacing: -0.3px; }

/* ─── Content Section ─── */
.form-content {
  flex: 1; min-height: 0;
  background: #FFFFFF; border-radius: 24px;
  padding: 24px;
  display: flex; flex-direction: column; gap: 24px;
  overflow-y: auto;
}
.input-section { display: flex; gap: 48px; }

.form-col { width: 320px; flex: none; display: flex; flex-direction: column; }
.form-col.col-left  { gap: 32px; }
.form-col.col-right { gap: 24px; }

.switches-frame { display: flex; flex-direction: column; gap: 16px; }
.inputs-frame   { display: flex; flex-direction: column; gap: 16px; }

.form-block { display: flex; flex-direction: column; gap: 8px; }
.block-label {
  font-size: 12px; font-weight: 500; line-height: 1.4; color: #AAAAAA;
  display: flex; align-items: center; gap: 4px;
}
.block-label img { width: 16px; height: 16px; display: block; flex: none; opacity: 0.5; }

/* Switches */
.seg { display: flex; align-items: center; gap: 4px; background: #F7F7F7; border-radius: 16px; padding: 4px; height: 41px; width: 208px; }
#seg-status { width: 320px; }
.seg-btn {
  flex: 1; height: 33px; border: none; border-radius: 12px; background: transparent; color: #666666;
  font-family: 'PT Root UI', sans-serif; font-size: 12px; font-weight: 500; line-height: 1.4;
  cursor: pointer; transition: background 0.13s, color 0.13s; white-space: nowrap; padding: 8px 12px;
}
.seg-btn:hover:not(.active):not(:disabled) { color: #1F1F1F; }
.seg-btn.active { background: #1A1A1A; color: #FFFFFF; }
.seg-btn[data-val="Newcomer"].active { background: #F74A96; }
.seg-btn[data-val="Archive"].active { background: #666666; }
.seg-btn:disabled { opacity: 0.45; cursor: default; }

/* Inputs */
.f-input {
  width: 100%; height: 52px; background: #F7F7F7; border: 1.5px solid transparent; border-radius: 16px;
  padding: 16px 20px; font-family: 'PT Root UI', sans-serif; font-size: 12px; font-weight: 500; line-height: 1.4; color: #1F1F1F;
  outline: none; transition: border-color 0.15s, background 0.15s;
}
.f-input:focus { background: #FFFFFF; border-color: #F74A96; }
.f-input:disabled { opacity: 0.45; cursor: default; }

/* Racket group */
.racket-group { display: flex; flex-direction: column; gap: 12px; }
.racket-head  { display: flex; align-items: center; gap: 8px; }
.racket-head img { width: 14px; height: 14px; display: block; }

/* ─── Footer of section ─── */
.form-footer {
  flex: none; height: 72px;
  background: #FFFFFF; border-radius: 24px;
  display: flex; align-items: center;
  padding: 12px; gap: 8px;
}
.form-btn {
  height: 48px; padding: 0 24px;
  border: none; border-radius: 16px;
  font-family: 'PT Root UI', sans-serif; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: background 0.13s;
}
.form-btn.primary   { background: #1A1A1A; color: #FFFFFF; }
.form-btn.primary:hover  { background: #333333; }
.form-btn.secondary { background: #EDEDED; color: #1F1F1F; }
.form-btn.secondary:hover { background: #DDDDDD; }
.form-btn.danger    { background: transparent; color: #E03A1F; margin-left: auto; }
.form-btn.danger:hover   { background: #FDE8E8; }

/* Delete modal */
.modal-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(20,20,20,0.42); display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay[hidden] { display: none; }
.modal { background: #FFFFFF; border-radius: 24px; padding: 28px 24px 24px; width: 360px; max-width: 100%; box-shadow: 0 8px 40px rgba(0,0,0,0.18); }
.modal h3 { margin: 0 0 8px; font-size: 20px; font-weight: 700; color: #1F1F1F; }
.modal p  { margin: 0 0 24px; font-size: 14px; line-height: 1.6; color: #666666; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions button { flex: 1; height: 48px; border: none; border-radius: 20px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
.modal-cancel { background: #F0F0F0; color: #1F1F1F; }
.modal-cancel:hover { background: #E6E6E6; }
.modal-danger { background: #F26B3A; color: #FFFFFF; }
.modal-danger:hover { background: #E05A2A; }
</style>
</head>
<body>
<div class="shell">

  <!-- ─── Left Frame ─── -->
  <div class="lf">
    <div class="logo-head">
      <img src="assets/logo-badge.svg" alt="TTCB" />
      <span class="logo-wordmark">TTCB Admin</span>
    </div>
    <!-- Neither nav item is active when editing a player -->
    <div class="nav-panel">
      <nav>
        <a href="players.html" class="nav-item">
          <img src="assets/nav-icon-players.svg" alt="" />
          <span>Players</span>
        </a>
        <a href="tournaments.html" class="nav-item">
          <img src="assets/nav-icon-tournaments.svg" alt="" />
          <span>Tournaments</span>
        </a>
      </nav>
    </div>
  </div>

  <!-- ─── Right Frame ─── -->
  <div class="rf">

    <!-- 1. Head of section -->
    <div class="form-hdr">
      <div class="form-title-frame">
        <div class="form-icon">
          <img src="assets/icon-person.svg" alt="" />
        </div>
        <span class="form-title" id="player-name">Loading…</span>
      </div>
    </div>

    <!-- 2. Content Section -->
    <div class="form-content">
      <div class="input-section">

        <!-- Left column -->
        <div class="form-col col-left">

          <div class="switches-frame">
            <div class="form-block">
              <span class="block-label"><img src="assets/icon-info.svg" alt=""/>Sex</span>
              <div class="seg" id="seg-gender">
                <button class="seg-btn active" data-val="m">Man</button>
                <button class="seg-btn" data-val="f">Women</button>
              </div>
            </div>
            <div class="form-block">
              <span class="block-label"><img src="assets/icon-info.svg" alt=""/>Playing hand</span>
              <div class="seg" id="seg-hand">
                <button class="seg-btn active" data-val="right">Right</button>
                <button class="seg-btn" data-val="left">Left</button>
              </div>
            </div>
          </div>

          <div class="inputs-frame">
            <div class="form-block">
              <label class="block-label" for="f-first"><img src="assets/icon-info.svg" alt=""/>Name</label>
              <input class="f-input" id="f-first" type="text" maxlength="30" placeholder="Enter name" autocomplete="off" />
            </div>
            <div class="form-block">
              <label class="block-label" for="f-last"><img src="assets/icon-info.svg" alt=""/>Last name</label>
              <input class="f-input" id="f-last" type="text" maxlength="30" placeholder="Enter last name" autocomplete="off" />
            </div>
            <div class="form-block">
              <label class="block-label" for="f-birth"><img src="assets/icon-info.svg" alt=""/>Birthday</label>
              <input class="f-input" id="f-birth" type="text" inputmode="numeric" maxlength="10" placeholder="00.00.0000" />
            </div>
          </div>

        </div>

        <!-- Right column -->
        <div class="form-col col-right">

          <div class="form-block">
            <span class="block-label"><img src="assets/icon-info.svg" alt=""/>Status</span>
            <div class="seg" id="seg-status">
              <button class="seg-btn" data-val="Regular">Regular</button>
              <button class="seg-btn active" data-val="Newcomer">Newcomer</button>
              <button class="seg-btn" data-val="Archive">Archive</button>
            </div>
          </div>

          <div class="form-block">
            <label class="block-label" for="f-rating"><img src="assets/icon-info.svg" alt=""/>Rating</label>
            <input class="f-input" id="f-rating" type="text" inputmode="numeric" maxlength="4" placeholder="ex 100" />
          </div>

          <div class="racket-group">
            <div class="racket-head">
              <img src="assets/icon-racket.svg" alt="" />
              <span class="block-label">Racket</span>
            </div>
            <div class="form-block">
              <label class="block-label" for="f-blade"><img src="assets/icon-info.svg" alt=""/>Blade</label>
              <input class="f-input" id="f-blade" type="text" maxlength="60" placeholder="Blade" autocomplete="off" />
            </div>
            <input class="f-input" id="f-fh" type="text" maxlength="60" placeholder="Right rubber" autocomplete="off" />
            <input class="f-input" id="f-bh" type="text" maxlength="60" placeholder="Left rubber" autocomplete="off" />
          </div>

        </div>
      </div>
    </div>

    <!-- 3. Footer of section -->
    <div class="form-footer">
      <button class="form-btn primary"   id="save-btn">Save changes</button>
      <button class="form-btn secondary" id="cancel-btn">Cancel</button>
      <button class="form-btn danger"    id="delete-btn">Delete player</button>
    </div>

  </div>
</div>

<div class="modal-overlay" id="delete-modal" hidden>
  <div class="modal">
    <h3>Delete player?</h3>
    <p>This player will be permanently removed from the roster.</p>
    <div class="modal-actions">
      <button class="modal-cancel" id="del-cancel">Cancel</button>
      <button class="modal-danger" id="del-confirm">Delete</button>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script src="nav.js"></script>
<script>
  const editId = new URLSearchParams(location.search).get('id');
  if (!editId) { window.location.href = 'players.html'; }

  function wireSeg(id) {
    const seg = document.getElementById(id);
    seg.addEventListener('click', e => {
      const b = e.target.closest('.seg-btn');
      if (!b || b.disabled) return;
      seg.querySelectorAll('.seg-btn').forEach(x => x.classList.toggle('active', x === b));
    });
    return () => (seg.querySelector('.seg-btn.active') || seg.querySelector('.seg-btn')).dataset.val;
  }
  function setSeg(id, val) {
    document.querySelectorAll('#' + id + ' .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.val === val));
  }

  const getGender = wireSeg('seg-gender');
  const getHand   = wireSeg('seg-hand');
  const getStatus = wireSeg('seg-status');
  function val(id) { return document.getElementById(id).value.trim(); }

  const birthEl = document.getElementById('f-birth');
  birthEl.addEventListener('input', () => {
    let d = birthEl.value.replace(/[^0-9]/g, '').slice(0, 8);
    let out = d.slice(0, 2);
    if (d.length > 2) out += '.' + d.slice(2, 4);
    if (d.length > 4) out += '.' + d.slice(4, 8);
    birthEl.value = out;
  });

  const ratingEl = document.getElementById('f-rating');
  ratingEl.addEventListener('input', () => { ratingEl.value = ratingEl.value.replace(/[^0-9]/g, '').slice(0, 4); });

  async function init() {
    const [p, me] = await Promise.all([
      API.getPlayer(editId, { ungated: true }),
      fetch('/api/me').then(r => r.json()),
    ]);
    if (!p) { _navigate('players.html'); return; }

    document.title = (p.name || 'Player') + ' — TTCB Admin';
    document.getElementById('player-name').textContent = p.name || '—';

    document.getElementById('f-first').value  = p.firstName || '';
    document.getElementById('f-last').value   = p.lastName  || '';
    document.getElementById('f-birth').value  = p.birth     || '';
    document.getElementById('f-rating').value = p.rating != null ? p.rating : '';
    document.getElementById('f-blade').value  = p.blade     || '';
    document.getElementById('f-fh').value     = p.forehand  || '';
    document.getElementById('f-bh').value     = p.backhand  || '';

    if (p.gender) setSeg('seg-gender', p.gender);
    if (p.hand)   setSeg('seg-hand',   p.hand);
    if (p.status) setSeg('seg-status', p.status);

    if (me.role === 'guest') {
      document.querySelectorAll('.f-input, .seg-btn').forEach(el => { el.disabled = true; });
      document.getElementById('save-btn').style.display   = 'none';
      document.getElementById('delete-btn').style.display = 'none';
      document.getElementById('cancel-btn').textContent   = 'Back';
    }
  }

  document.getElementById('save-btn').addEventListener('click', async () => {
    const first = val('f-first'), last = val('f-last');
    if (!first && !last) { const el = document.getElementById('f-last'); el.focus(); el.style.borderColor = '#F74A96'; return; }
    const rt = val('f-rating');
    await API.savePlayer({
      id: editId,
      name: [last, first].filter(Boolean).join(' '),
      firstName: first, lastName: last, birth: val('f-birth'),
      gender: getGender(), hand: getHand(), status: getStatus(),
      rating: rt === '' ? null : parseInt(rt, 10),
      blade: val('f-blade'), forehand: val('f-fh'), backhand: val('f-bh'),
    });
    _navigate('players.html');
  });

  document.getElementById('cancel-btn').addEventListener('click', () => _navigate('players.html'));

  const deleteModal = document.getElementById('delete-modal');
  document.getElementById('delete-btn').addEventListener('click', () => { deleteModal.hidden = false; });
  document.getElementById('del-cancel').addEventListener('click', () => { deleteModal.hidden = true; });
  deleteModal.addEventListener('click', e => { if (e.target === deleteModal) deleteModal.hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !deleteModal.hidden) deleteModal.hidden = true; });
  document.getElementById('del-confirm').addEventListener('click', async () => {
    await API.deletePlayer(editId);
    _navigate('players.html');
  });

  init();
</script>
</body>
</html>
