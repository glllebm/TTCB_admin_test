<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" href="assets/Logo.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Players — TTCB Admin</title>
<style>
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_light.woff2') format('woff2'),url('assets/fonts/pt-root-ui_light.woff') format('woff');font-weight:300;}
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_regular.woff2') format('woff2'),url('assets/fonts/pt-root-ui_regular.woff') format('woff');font-weight:400;}
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_medium.woff2') format('woff2'),url('assets/fonts/pt-root-ui_medium.woff') format('woff');font-weight:500;}
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_bold.woff2') format('woff2'),url('assets/fonts/pt-root-ui_bold.woff') format('woff');font-weight:700;}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; background: #F7F7F7; font-family: 'PT Root UI', sans-serif; -webkit-font-smoothing: antialiased; }
input::placeholder { color: #999999; }

/* ─────────────── Shell: 1440×800 root frame ─────────────── */
.shell {
  height: 100vh; width: 100%; max-width: 100vw;
  padding: 12px; gap: 12px;
  display: flex; align-items: flex-start;
  overflow: hidden; box-sizing: border-box;
}

/* ─────────────── Left Frame: 251px ────────────────────────── */
.lf {
  width: 251px; flex: none;
  height: 100%; /* = 776px at 800 viewport */
  display: flex; flex-direction: column; gap: 12px;
}

/* Logo head: 251×64 */
.logo-head {
  width: 251px; height: 64px; flex: none;
  background: #FFFFFF; border-radius: 24px;
  padding: 12px 24px;
  display: flex; align-items: center; gap: 12px;
}
.logo-head img { width: 32px; height: 32px; display: block; flex: none; }
.logo-wordmark { font-size: 20px; font-weight: 700; color: #1F1F1F; white-space: nowrap; }

/* Side bar (nav): fill height */
.nav-panel {
  flex: 1; /* = 700px at 800 viewport */
  background: #FFFFFF; border-radius: 24px;
  padding: 12px;
  display: flex; flex-direction: column;
  min-height: 0;
}
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 12px;
  font-family: 'PT Root UI', sans-serif; font-size: 16px; font-weight: 500; color: #333333;
  text-decoration: none; border: none; background: transparent;
  cursor: pointer; width: 100%; transition: background 0.12s;
}
.nav-item:hover { background: #F7F7F7; }
.nav-item.active { background: #F0F0F0; }
.nav-item img { width: 24px; height: 24px; display: block; flex: none; }

/* ─────────────── Right Frame: fill ─────────────────────────── */
.rf {
  flex: 1; min-width: 0; height: 100%;
  display: flex; flex-direction: column; gap: 12px;
  overflow: hidden;
}

/* Header of section: 64px tall, two cards side by side, gap 8px */
.hdr { flex: none; height: 64px; display: flex; gap: 8px; }

/* Search section: 316×64 */
.search-card {
  width: 316px; flex: none; height: 64px;
  background: #FFFFFF; border-radius: 24px;
  padding: 12px;
  display: flex; align-items: center;
}
/* Search field: 292×40 */
.search-field {
  width: 292px; height: 40px;
  background: #F7F7F7; border-radius: 12px;
  padding: 10px 12px; gap: 8px;
  display: flex; align-items: center;
}
.search-field img { width: 16px; height: 16px; display: block; flex: none; }
.search-field input {
  flex: 1; border: none; outline: none; background: transparent;
  font-family: 'PT Root UI', sans-serif; font-size: 14px; font-weight: 500; color: #1F1F1F;
}

/* Filter section: fill×64 */
.filter-card {
  flex: 1; height: 64px;
  background: #FFFFFF; border-radius: 24px;
  padding: 12px 24px; gap: 32px;
  display: flex; align-items: center;
}
.pill-group { display: flex; gap: 4px; }
/* Filter tag: 3 states — default transparent / hover Gray5 / active Gray90 */
.pill {
  height: 22px; padding: 4px 8px; border-radius: 24px;
  border: none; background: transparent; color: #1F1F1F;
  font-family: 'PT Root UI', sans-serif; font-size: 12px; font-weight: 500; line-height: 1.4;
  cursor: pointer; transition: background 0.12s, color 0.12s; white-space: nowrap;
  display: flex; align-items: center;
}
.pill.active { background: #1A1A1A; color: #FFFFFF; }
.pill:not(.active):hover { background: #F7F7F7; }

/* Content Section: fills remaining space between header and add-bar */
.content-card {
  flex: 1; min-height: 0;
  background: #FFFFFF; border-radius: 24px;
  padding: 12px;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* Tab Header: 30px, bottom border
   Divider inset 12px from card edges (handled by card's padding:12px).
   Cell content inset 20px (12px card + 8px row padding).
   Column widths: Rank 80 / Player 1fr / Tournaments 72 / Rating 72 / Status 75
                  Identifier 72 (track 96 = 72 pill + 24 margin) / Registration 80 / Edit 40 (track 64 = 40 btn + 24 margin)
   Cluster gaps: 8px within sub-groups, 32px between sub-groups and before edit
   (column-gap:8px + margin-left:24px on children 6 and 8; tracks for 6 and 8 are widened by 24px to absorb the margin) */
.tab-header {
  flex: none; height: 30px;
  border-bottom: 1px solid #F0F0F0;
  padding: 0 8px 0 20px;
  display: grid;
  grid-template-columns: 80px minmax(0,1fr) 72px 72px 75px 96px 80px 64px;
  column-gap: 8px; align-items: center;
}
.tab-header span {
  font-size: 10px; font-weight: 400; color: #AAAAAA; line-height: 1.4;
}
/* Cluster boundary: Identifier (6th) and Edit header (8th) */
.tab-header > span:nth-child(6),
.tab-header > span:nth-child(8) { margin-left: 24px; }

/* Tab List: scrollable vertically, clipped horizontally */
.tab-list { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }

/* Tab row: 57px, same column grid, padding 0 8px 0 20px for 32px left / 20px right cell-content inset */
.tab-row {
  display: grid;
  grid-template-columns: 80px minmax(0,1fr) 72px 72px 75px 96px 80px 64px;
  column-gap: 8px; align-items: center;
  height: 57px; padding: 0 8px 0 20px;
  border-bottom: 1px solid #F0F0F0;
  cursor: pointer; transition: background 0.1s;
}
.tab-row:last-child { border-bottom: none; }
.tab-row:hover { background: #FAFAFA; }
/* Cluster boundaries */
.tab-row > :nth-child(8) { margin-left: 24px; }
/* Identifier (6th): margin-left:24px creates the 32px cluster gap; width calc corrects for
   the margin so the pill stays 72px and doesn't overflow into the Registration column */
.tab-row > :nth-child(6) { margin-left: 24px; width: calc(100% - 24px); }
/* Tournaments pill: center content within the pill */
.tab-row > :nth-child(3) { justify-content: center; }

/* ── Cell styles ── */

/* Rank: number + delta */
.rank-cell { display: flex; align-items: center; gap: 5px; }
.rank-num { font-size: 14px; font-weight: 700; color: #1F1F1F; font-variant-numeric: tabular-nums; }
.rank-delta { display: flex; align-items: center; gap: 2px; }
.rank-delta img { width: 11px; height: 11px; display: block; }
.rank-delta-num { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
.rank-delta-num.up   { color: #5AAD32; }
.rank-delta-num.down { color: #ED592C; }

/* Player name: 14px Medium per spec */
.player-name {
  font-size: 14px; font-weight: 500; line-height: 1.4; color: #1F1F1F;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Info tag pill — shared by Tournaments, Status, Identifier, Registration
   width:100% fills the available track space (track width minus any margin-left) */
.info-tag {
  display: flex; align-items: center; gap: 2px;
  width: 100%;
  padding: 6px 8px; border-radius: 8px;
  background: #F7F7F7;
  font-size: 12px; font-weight: 500; line-height: 1.4; color: #1F1F1F;
  font-variant-numeric: tabular-nums;
}
.info-tag.s-newcomer { color: #F74A96; }
.info-tag.s-regular  { color: #666666; }
.info-tag.s-archive  { color: #BBBBBB; }
.info-tag.muted      { color: #1A1A1A; }

/* Rating pill — Gray 5 background, fills its ratingWrap (which fills the 72px grid cell) */
.rating-pill {
  display: flex; align-items: center; gap: 4px;
  width: 100%;
  padding: 6px 8px; border-radius: 8px;
  background: #F7F7F7;
}
.rating-val { font-size: 12px; font-weight: 500; color: #F74A96; font-variant-numeric: tabular-nums; }
.rating-no  { font-size: 12px; font-weight: 500; color: #CCCCCC; }
.rating-pill.empty { justify-content: center; }
.trend-img  { width: 16px; height: 16px; display: block; flex: none; }

/* Edit icon button: 40×28, Gray 10 fill, radius 12px, padding 8px 12px */
.edit-btn {
  width: 40px; height: 28px;
  background: #EDEDED; border-radius: 12px;
  padding: 8px 12px; gap: 8px;
  display: flex; align-items: center; justify-content: center;
  text-decoration: none; cursor: pointer;
  transition: background 0.12s;
}
.edit-btn:hover { background: #DDDDDD; }
.edit-btn img { width: 14px; height: 14px; display: block; }

/* Empty state */
.tab-empty { padding: 40px; text-align: center; color: #AAAAAA; font-size: 14px; font-weight: 500; }

/* ─────────────── Add-player bar: 72px ──────────────────────── */
.add-bar {
  flex: none; height: 72px;
  background: #FFFFFF; border-radius: 24px;
  display: flex; align-items: flex-start; justify-content: flex-start;
  padding: 12px;
}
.add-btn {
  display: inline-flex; align-items: center; gap: 4px;
  height: 48px; padding: 12px 24px 12px 17px;
  border: none; border-radius: 16px;
  background: #EDEDED; color: #1F1F1F;
  font-family: 'PT Root UI', sans-serif; font-size: 14px; font-weight: 600;
  cursor: pointer; text-decoration: none; transition: background 0.12s;
}
.add-btn:hover { background: #DDDDDD; }
.add-btn img { width: 16px; height: 16px; display: block; }
</style>
</head>
<body>
<div class="shell">

  <!-- ─── Left Frame (251px) ─── -->
  <div class="lf">
    <!-- Logo head: 251×64 -->
    <div class="logo-head">
      <img src="assets/logo-badge.svg" alt="TTCB" />
      <span class="logo-wordmark">TTCB Admin</span>
    </div>
    <!-- Side bar (nav): fill 700px -->
    <div class="nav-panel">
      <nav>
        <a href="players.html" class="nav-item active">
          <img src="assets/nav-icon-players.svg" alt="" />
          <span>Players</span>
        </a>
        <a href="tournaments.html" class="nav-item">
          <img src="assets/nav-icon-tournaments.svg" alt="" />
          <span>Tournaments</span>
        </a>
      </nav>
    </div>
  </div>

  <!-- ─── Right Frame (fill) ─── -->
  <div class="rf">

    <!-- 1. Header of section (64px): Search card + Filter card -->
    <div class="hdr">
      <!-- Search section: 316×64 -->
      <div class="search-card">
        <div class="search-field">
          <img src="assets/icon-search.svg" alt="" />
          <input type="text" id="search" placeholder="Player search" autocomplete="off" />
        </div>
      </div>
      <!-- Filter section: fill×64, padding 12px 24px, gap 16px -->
      <div class="filter-card">
        <div class="pill-group" id="status-pills">
          <button class="pill active" data-status="all">All</button>
          <button class="pill" data-status="Regular">Regular</button>
          <button class="pill" data-status="Newcomer">Newcomer</button>
          <button class="pill" data-status="Archive">Archive</button>
        </div>
        <div class="pill-group" id="sex-pills">
          <button class="pill active" data-sex="all">All</button>
          <button class="pill" data-sex="m">Men</button>
          <button class="pill" data-sex="f">Women</button>
        </div>
      </div>
    </div>

    <!-- 2. Content Section (616px fixed) -->
    <div class="content-card">
      <!-- Tab Header: 30px -->
      <div class="tab-header">
        <span>Rank</span>
        <span>Player</span>
        <span>Tournaments</span>
        <span>Rating</span>
        <span>Status</span>
        <span>Identifier</span>
        <span>Registration</span>
        <span></span>
      </div>
      <!-- Tab List: scrollable -->
      <div class="tab-list" id="list"></div>
    </div>

    <!-- 3. Add-player bar (72px) -->
    <div class="add-bar">
      <a class="add-btn" id="add-btn" href="new-player.html">
        <img src="assets/icon-plus.svg" alt="" />
        Add player
      </a>
    </div>

  </div>
</div>

<script src="api.js"></script>
<script>
  function fmtDate(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
  }

  let roster = [];
  let statusFilter = 'all', sexFilter = 'all';
  let justAdded = sessionStorage.getItem('tm_just_added') || null;
  if (justAdded) sessionStorage.removeItem('tm_just_added');

  function sortedRoster() {
    return roster.map((p, i) => ({ p, i }))
      .sort((a, b) => {
        const ra = a.p.rating, rb = b.p.rating;
        if (ra == null && rb == null) return a.i - b.i;
        if (ra == null) return 1; if (rb == null) return -1;
        return rb - ra;
      })
      .map((x, rank) => ({ player: x.p, rank: rank + 1 }));
  }

  function matchesSearch(p, q) {
    if (!q) return true;
    const cid = String(p.clubId || '');
    const name = (p.name || '').toLowerCase();
    return name.includes(q) || (q.length >= 4 ? cid.includes(q) : cid === q);
  }

  const listEl   = document.getElementById('list');
  const searchEl = document.getElementById('search');

  function render() {
    const q = searchEl.value.trim().toLowerCase();
    listEl.innerHTML = '';

    const visible = sortedRoster().filter(({ player: p }) =>
      matchesSearch(p, q) &&
      (statusFilter === 'all' || p.status === statusFilter) &&
      (sexFilter === 'all' || p.gender === sexFilter)
    );

    if (!visible.length) {
      listEl.innerHTML = '<div class="tab-empty">' +
        ((q || statusFilter !== 'all' || sexFilter !== 'all')
          ? 'No players match the current filters.'
          : 'No players yet.') +
        '</div>';
      return;
    }
    visible.forEach(({ player: p, rank }) => listEl.appendChild(buildRow(p, rank)));
    justAdded = null;
  }

  function buildRow(p, rank) {
    const row = document.createElement('div');
    row.className = 'tab-row';
    row.addEventListener('click', e => {
      if (e.target.closest('.edit-btn')) return;
      window.location.href = 'player.html?id=' + encodeURIComponent(p.id);
    });

    // ── Rank + rank-change ──
    const rankCell = document.createElement('div');
    rankCell.className = 'rank-cell';
    const rn = document.createElement('span');
    rn.className = 'rank-num';
    rn.textContent = rank;
    rankCell.appendChild(rn);
    if (p.rankChange && p.rankChange !== 0) {
      const delta = document.createElement('div');
      delta.className = 'rank-delta';
      const img = document.createElement('img');
      img.src = p.rankChange > 0 ? 'assets/icon-arrow-up.svg' : 'assets/icon-arrow-down.svg';
      const num = document.createElement('span');
      num.className = 'rank-delta-num ' + (p.rankChange > 0 ? 'up' : 'down');
      num.textContent = Math.abs(p.rankChange);
      delta.append(img, num);
      rankCell.appendChild(delta);
    }

    // ── Player name ──
    const name = document.createElement('div');
    name.className = 'player-name';
    name.textContent = p.name || '—';

    // ── Tournaments (info-tag pill, Gray 5) ──
    const trnmt = document.createElement('div');
    trnmt.className = 'info-tag';
    trnmt.textContent = p.tournaments != null ? p.tournaments : '0';

    // ── Rating (pink pill) ──
    const ratingWrap = document.createElement('div');
    if (p.rating == null) {
      const pill = document.createElement('div');
      pill.className = 'rating-pill empty';
      const noRating = document.createElement('span');
      noRating.className = 'rating-no';
      noRating.textContent = 'No rating';
      pill.appendChild(noRating);
      ratingWrap.appendChild(pill);
    } else {
      const pill = document.createElement('div');
      pill.className = 'rating-pill';
      const v = document.createElement('span');
      v.className = 'rating-val';
      v.textContent = p.rating;
      pill.appendChild(v);
      if (p.trend === 'up' || p.trend === 'down') {
        const tImg = document.createElement('img');
        tImg.className = 'trend-img';
        tImg.src = p.trend === 'up' ? 'assets/icon-arrow-up.svg' : 'assets/icon-arrow-down.svg';
        pill.appendChild(tImg);
      }
      ratingWrap.appendChild(pill);
    }

    // ── Status (info-tag pill, colored text, Gray 5 background) ──
    const status = document.createElement('div');
    const s = (p.status || '').toLowerCase();
    status.className = 'info-tag ' + (s === 'newcomer' ? 's-newcomer' : s === 'archive' ? 's-archive' : 's-regular');
    status.textContent = p.status || '—';

    // ── Identifier (info-tag pill, muted text) ──
    const idEl = document.createElement('div');
    idEl.className = 'info-tag muted';
    idEl.textContent = p.clubId || '—';

    // ── Registration (info-tag pill, muted text) ──
    const dateEl = document.createElement('div');
    dateEl.className = 'info-tag muted';
    dateEl.textContent = fmtDate(p.registeredAt);

    // ── Edit (circular icon button) ──
    const editBtn = document.createElement('a');
    editBtn.className = 'edit-btn';
    editBtn.href = 'player.html?id=' + encodeURIComponent(p.id);
    editBtn.title = 'Edit';
    const editImg = document.createElement('img');
    editImg.src = 'assets/icon-edit.svg';
    editImg.alt = '';
    editBtn.appendChild(editImg);

    row.append(rankCell, name, trnmt, ratingWrap, status, idEl, dateEl, editBtn);
    return row;
  }

  // ── Filter interactions ──
  document.getElementById('status-pills').addEventListener('click', e => {
    const btn = e.target.closest('.pill'); if (!btn) return;
    document.querySelectorAll('#status-pills .pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active'); statusFilter = btn.dataset.status; render();
  });
  document.getElementById('sex-pills').addEventListener('click', e => {
    const btn = e.target.closest('.pill'); if (!btn) return;
    document.querySelectorAll('#sex-pills .pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active'); sexFilter = btn.dataset.sex; render();
  });
  searchEl.addEventListener('input', render);

  // ── Guest: hide Add player ──
  fetch('/api/me').then(r => r.json()).then(me => {
    if (me.role === 'guest') document.getElementById('add-btn').style.display = 'none';
  });

  // ── Load ──
  API.getPlayers({ ungated: true })
    .then(data => { roster = data; render(); })
    .catch(() => { listEl.innerHTML = '<div class="tab-empty">Error loading data.</div>'; });
</script>
</body>
</html>
