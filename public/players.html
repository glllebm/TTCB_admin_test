<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="assets/Logo.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Игроки</title>
<style>
  :root {
    --bg: #f5f5f5;
    --card: #ffffff;
    --border: #EBEBEB;
    --ink: #1a1a1a;
    --pink: #e93a8f;
    --pink-soft: #fce4f0;
    --muted: #9a9a9a;
    --title: #4a4a4a;
    --up: #5AAD32;
    --down: #ED6455;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }

  body {
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
    padding: 0 0 72px;
  }

  /* ---- shared header ---- */
  .header {
    position: relative;
    width: 100%;
    height: 72px;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header img.logo { display: block; width: 48px; height: 48px; }
  .header .nav-back {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 14px 9px 11px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .header .nav-back:hover { background: #f4f4f4; }
  .header .nav-back svg { display: block; }

  .wrap { max-width: 620px; margin: 32px auto 0; padding: 0 20px; }

  /* ---- page head: icon + title + search + add ---- */
  .head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 22px;
  }
  .head-left { display: flex; align-items: center; gap: 12px; flex: none; }
  .head-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: #1f1f1f;
    display: grid;
    place-items: center;
    flex: none;
  }
  .head-icon img { width: 22px; height: 22px; display: block; }
  .head h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.5px;
    color: var(--title);
    white-space: nowrap;
  }

  .search {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 9px;
    height: 44px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0 14px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search:focus-within { border-color: var(--pink); box-shadow: 0 0 0 3px var(--pink-soft); }
  .search svg { flex: none; display: block; }
  .search input {
    flex: 1 1 auto;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }
  .search input::placeholder { color: var(--muted); }

  .add-btn {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 44px;
    background: #1f1f1f;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s ease;
  }
  .add-btn:hover { background: #000000; }
  .add-btn .plus { font-size: 17px; line-height: 1; font-weight: 600; margin-top: -1px; }

  /* ---- list ---- */
  #list { display: flex; flex-direction: column; gap: 14px; }
  .p-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 6px 12px;
  }
  .p-row {
    display: flex;
    align-items: center;
    padding: 14px 8px;
    cursor: pointer;
    border-radius: 12px;
    transition: background 0.13s;
  }
  .p-row:hover { background: #fafafa; }
  .p-row + .p-row { border-top: 1px solid #f4f4f4; }
  .p-row.row-enter { animation: pop 0.28s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop {
    from { opacity: 0; transform: translateY(-6px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }

  .p-num {
    flex: none;
    width: 64px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .p-bar {
    width: 1px;
    height: 24px;
    background: var(--border);
    margin: 0 16px 0 14px;
    flex: none;
  }
  .p-name {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .p-rating {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 96px;
    height: 38px;
    padding: 0 14px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 11px;
  }
  .p-rating .val { font-size: 15px; font-weight: 700; color: #2a2a2a; font-variant-numeric: tabular-nums; }
  .p-rating .tri { display: block; line-height: 0; }
  .p-rating.none {
    border-color: #f0f0f0;
  }
  .p-rating.none .val { color: #c4c4c4; font-weight: 600; font-size: 14px; }

  .empty {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 48px 28px;
    text-align: center;
    color: #a8a8a8;
    font-size: 14px;
    font-weight: 500;
  }

  /* ---- add modal ---- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(20, 20, 20, 0.42);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: #ffffff; border-radius: 16px;
    padding: 24px; width: 360px; max-width: 100%;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
  }
  .modal h3 { margin: 0 0 18px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
  .modal .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .modal .field label { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .modal .field input {
    width: 100%; height: 44px;
    border: 1px solid var(--border); border-radius: 12px;
    background: #ffffff; padding: 0 14px;
    font-family: inherit; font-size: 14px; font-weight: 500; color: var(--ink);
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .modal .field input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px var(--pink-soft); }
  .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
  .modal-actions button {
    flex: 1; height: 46px; border: none; border-radius: 11px;
    font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  .modal-cancel { background: #f0f0f0; color: var(--ink); }
  .modal-cancel:hover { background: #e6e6e6; }
  .modal-confirm { background: var(--pink); color: #ffffff; }
  .modal-confirm:hover:not(:disabled) { background: #d22f7f; }
  .modal-confirm:disabled { background: #ececec; color: #b4b4b4; cursor: not-allowed; }

  @media (max-width: 768px) {
    input, textarea, select { font-size: 16px !important; }
  }

  @media (max-width: 560px) {
    .wrap { padding: 0 14px; }
    .head { flex-wrap: wrap; }
    .head-left { width: 100%; }
    .head h1 { font-size: 22px; }
    .search { flex: 1 1 100%; }
    .add-btn { flex: 1 1 100%; justify-content: center; }
    .p-num { width: 38px; }
    .p-bar { margin: 0 10px; }
    .p-rating { min-width: 0; padding: 0 10px; }
    .p-rating .val { font-size: 14px; }
    .p-rating.none .val { font-size: 12px; white-space: nowrap; }
    .p-row { padding: 10px 6px; }
  }
</style>
</head>
<body>
  <header class="header">
    <a class="nav-back" href="index.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18L9 12L15 6" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Назад
    </a>
    <img class="logo" src="assets/Logo.svg" alt="Table Tennis Club Beograde" />
  </header>

  <div class="wrap">
    <div class="head">
      <div class="head-left">
        <div class="head-icon"><img src="assets/icon-players.svg" alt="" /></div>
        <h1>Игроки</h1>
      </div>
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="#9a9a9a" stroke-width="2"/>
          <path d="M20 20L17 17" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" id="search" placeholder="Поиск" autocomplete="off" />
      </label>
      <a class="add-btn" id="add-btn" href="new-player.html"><span class="plus">+</span> Добавить</a>
    </div>

    <div id="list"></div>
  </div>

  <script src="api.js"></script>
  <script>
    fetch('/api/me').then(r=>r.json()).then(me => {
      if (me.role === 'guest') {
        document.getElementById('add-btn').style.display = 'none';
      }
    });

    const TRI_UP = '<svg width="9" height="8" viewBox="0 0 8 7" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.70942 0.556111L0.15609 4.98278C0.0558274 5.15097 0.00198372 5.34274 5.37718e-05 5.53854C-0.00187617 5.73434 0.0481768 5.92714 0.145104 6.09727C0.242032 6.2674 0.382363 6.40877 0.551777 6.50695C0.72119 6.60513 0.913618 6.6566 1.10942 6.65611H6.22942C6.42325 6.65523 6.61345 6.60344 6.78098 6.50595C6.94851 6.40846 7.0875 6.26868 7.18403 6.10059C7.28056 5.93251 7.33125 5.74201 7.33103 5.54818C7.3308 5.35435 7.27968 5.16397 7.18276 4.99611L4.62942 0.556111C4.53251 0.387125 4.39271 0.246714 4.22414 0.149068C4.05558 0.0514213 3.86423 0 3.66942 0C3.47462 0 3.28327 0.0514213 3.1147 0.149068C2.94614 0.246714 2.80634 0.387125 2.70942 0.556111Z" fill="#5AAD32"/></svg>';
    const TRI_DOWN = '<svg width="9" height="8" viewBox="0 0 8 7" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4.62942 6.1L7.18276 1.67334C7.28302 1.50515 7.33686 1.31337 7.33879 1.11757C7.34072 0.921778 7.29067 0.728976 7.19374 0.558845C7.09681 0.388713 6.95648 0.247344 6.78707 0.149166C6.61766 0.0509876 6.42523 -0.0004843 6.22942 3.43423e-06H1.10942C0.913618 -0.0004843 0.72119 0.0509876 0.551777 0.149166C0.382363 0.247344 0.242032 0.388713 0.145104 0.558845C0.0481768 0.728976 -0.00187617 0.921778 5.37718e-05 1.11757C0.00198372 1.31337 0.0558274 1.50515 0.15609 1.67334L2.70942 6.1C2.80634 6.26899 2.94614 6.4094 3.1147 6.50705C3.28327 6.60469 3.47462 6.65611 3.66942 6.65611C3.86423 6.65611 4.05558 6.60469 4.22414 6.50705C4.39271 6.4094 4.53251 6.26899 4.62942 6.1Z" fill="#ED6455"/></svg>';

    let roster = [];
    let justAdded = sessionStorage.getItem("tm_just_added") || null;
    if (justAdded) sessionStorage.removeItem("tm_just_added");


    const listEl = document.getElementById("list");
    const searchEl = document.getElementById("search");

    function sorted() {
      // rated players first (by rating desc), unrated at the bottom
      return roster
        .map((p, i) => ({ p, i }))
        .sort((a, b) => {
          const ra = a.p.rating, rb = b.p.rating;
          if (ra == null && rb == null) return a.i - b.i;
          if (ra == null) return 1;
          if (rb == null) return -1;
          return rb - ra;
        })
        .map((x) => x.p);
    }

    function render() {
      const q = (searchEl.value || "").trim().toLowerCase();
      const ranked = sorted(); // global rank order
      listEl.innerHTML = "";

      const matches = (p) => { const cid = String(p.clubId || ""); const name = (p.name||"").toLowerCase(); return !q || name.includes(q) || (q.length >= 4 ? cid.includes(q) : cid === q); };
      const anyMatch = ranked.some(matches);

      if (!ranked.length || !anyMatch) {
        const card = document.createElement("div");
        card.className = "p-card";
        const e = document.createElement("div");
        e.className = "empty";
        e.style.border = "none";
        e.style.padding = "32px 28px";
        e.textContent = q ? "Игроки не найдены." : "Список игроков пуст. Нажмите «Добавить».";
        card.appendChild(e);
        listEl.appendChild(card);
        return;
      }

      // top 10 by rating vs the rest — each in its own plaque
      const groups = [
        ranked.slice(0, 10),
        ranked.slice(10),
      ];
      let rankBase = 0;
      groups.forEach((group) => {
        const visible = group.filter(matches);
        const base = rankBase;
        rankBase += group.length;
        if (!visible.length) return;
        listEl.appendChild(buildCard(visible, group, base));
      });
      justAdded = null;
    }

    function buildCard(visible, group, base) {
      const card = document.createElement("div");
      card.className = "p-card";
      visible.forEach((p) => {
        const rank = base + group.indexOf(p) + 1;
        const row = document.createElement("div");
        row.className = "p-row" + (p.name === justAdded ? " row-enter" : "");

        const num = document.createElement("div");
        num.className = "p-num";
        num.textContent = rank;

        const bar = document.createElement("div");
        bar.className = "p-bar";

        const name = document.createElement("div");
        name.className = "p-name";
        name.textContent = p.name || "—";

        const rating = document.createElement("div");
        rating.className = "p-rating" + (p.rating == null ? " none" : "");
        const val = document.createElement("span");
        val.className = "val";
        if (p.rating == null) {
          val.textContent = "Нет рейтинга";
          rating.appendChild(val);
        } else {
          val.textContent = p.rating;
          rating.append(val);
          // Trend arrow only when the server sends one (i.e. rating changed
          // within the last 7 days); null/absent trend → number alone.
          if (p.trend === "up" || p.trend === "down") {
            const tri = document.createElement("span");
            tri.className = "tri";
            tri.innerHTML = p.trend === "down" ? TRI_DOWN : TRI_UP;
            rating.append(tri);
          }
        }

        row.append(num, bar, name, rating);
        row.addEventListener("click", () => {
          window.location.href = "player.html?id=" + encodeURIComponent(p.id);
        });
        card.appendChild(row);
      });
      return card;
    }

    searchEl.addEventListener("input", render);

    API.getPlayers({ ungated: true }).then((data) => {
      roster = data;
      render();
    }).catch(() => {
      listEl.innerHTML = '<div class="empty">Ошибка загрузки данных.</div>';
    });
  </script>
</body>
</html>
