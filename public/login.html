<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="assets/Logo.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Log in — TTCB Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/colors.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--gray-5);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Root frame: full-viewport, top-center alignment, 180px top padding */
  body {
    min-height: 800px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 180px 12px 12px 12px;
  }

  /* ── Section: 361px wide, three children at 48px gap ── */
  .section {
    width: 361px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
  }

  /* ── Head ─────────────────────────────────── */
  .head {
    width: 361px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 12px 0 0;
    gap: 10px;
  }
  .head-content {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
  }
  .head-content img { width: 32px; height: 32px; display: block; flex: none; }
  .wordmark {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -1px;
    color: var(--gray-90);
    white-space: nowrap;
  }

  /* ── Inputs Section ──────────────────────── */
  .inputs-section {
    width: 361px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }

  /* ── Input Block ─────────────────────────── */
  .input-block {
    width: 361px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .input-block label {
    font-size: 12px;
    font-weight: 500;
    line-height: 1.4;
    color: #AAAAAA;
  }
  .input-block input {
    width: 361px;
    height: 52px;
    background: var(--white);
    border: none;
    border-radius: 16px;
    padding: 16px 20px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--gray-90);
    outline: none;
  }
  .input-block input::placeholder {
    font-size: 12px;
    color: #AAAAAA;
  }

  /* ── Error ───────────────────────────────── */
  .error {
    font-size: 12px;
    font-weight: 500;
    color: #e23b3b;
  }
  .error[hidden] { display: none; }

  /* ── Submit button ───────────────────────── */
  .btn-login {
    width: 361px;
    height: 48px;
    background: var(--gray-90);
    color: var(--white);
    border: none;
    border-radius: 16px;
    padding: 12px 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-login:hover { background: var(--black); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
</head>
<body>

  <!-- Section wraps Head + form (form contains Inputs Section + Button) -->
  <div class="section">

    <!-- Head -->
    <div class="head">
      <div class="head-content">
        <img src="assets/logo-badge.svg" alt="TTCB" />
        <span class="wordmark">TTCB Admin</span>
      </div>
    </div>

    <!-- Form contains Inputs Section + Button as its two children (gap:48px from section) -->
    <form id="login-form" novalidate style="width:361px; display:flex; flex-direction:column; align-items:center; gap:48px;">

      <!-- Inputs Section -->
      <div class="inputs-section">
        <div class="input-block">
          <label for="login">Login</label>
          <input type="text" id="login" name="login" autocomplete="username" placeholder="Enter login" />
        </div>
        <div class="input-block">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter password" />
        </div>
        <div class="error" id="error" hidden></div>
      </div>

      <!-- Button -->
      <button class="btn-login" type="submit" id="submit-btn">Log in</button>

    </form>

  </div>

  <script>
    const form = document.getElementById("login-form");
    const loginEl = document.getElementById("login");
    const passEl = document.getElementById("password");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");

    [loginEl, passEl].forEach((el) =>
      el.addEventListener("input", () => { errorEl.hidden = true; })
    );

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const login = loginEl.value.trim();
      const pass = passEl.value;
      if (!login || !pass) {
        errorEl.textContent = "Please enter your login and password";
        errorEl.hidden = false;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: login, password: pass }),
        });

        if (res.ok) {
          window.location.href = "/players.html";
        } else {
          errorEl.textContent = "Invalid username or password";
          errorEl.hidden = false;
          submitBtn.disabled = false;
          submitBtn.textContent = "Log in";
        }
      } catch (err) {
        errorEl.textContent = "Connection error — please try again";
        errorEl.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
