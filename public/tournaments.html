<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" href="assets/Logo.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Tournaments — TTCB Admin</title>
<style>
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_light.woff2') format('woff2'),url('assets/fonts/pt-root-ui_light.woff') format('woff');font-weight:300;}
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_regular.woff2') format('woff2'),url('assets/fonts/pt-root-ui_regular.woff') format('woff');font-weight:400;}
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_medium.woff2') format('woff2'),url('assets/fonts/pt-root-ui_medium.woff') format('woff');font-weight:500;}
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_bold.woff2') format('woff2'),url('assets/fonts/pt-root-ui_bold.woff') format('woff');font-weight:700;}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; background: #F7F7F7; font-family: 'PT Root UI', sans-serif; -webkit-font-smoothing: antialiased; }
input::placeholder { color: #999999; }

/* ─────────────── Shell ─────────────── */
.shell {
  height: 100vh; width: 100%; max-width: 100vw;
  padding: 12px; gap: 12px;
  display: flex; align-items: flex-start;
  overflow: hidden; box-sizing: border-box;
}

/* ─────────────── Left Frame: 251px ─────────────── */
.lf {
  width: 251px; flex: none;
  height: 100%;
  display: flex; flex-direction: column; gap: 12px;
}
.logo-head {
  width: 251px; height: 64px; flex: none;
  background: #FFFFFF; border-radius: 24px;
  padding: 12px 24px;
  display: flex; align-items: center; gap: 12px;
}
.logo-head img { width: 32px; height: 32px; display: block; flex: none; }
.logo-wordmark { font-size: 20px; font-weight: 700; color: #1F1F1F; white-space: nowrap; }
.nav-panel {
  flex: 1;
  background: #FFFFFF; border-radius: 24px;
  padding: 12px;
  display: flex; flex-direction: column;
  min-height: 0;
}
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 12px;
  font-family: 'PT Root UI', sans-serif; font-size: 16px; font-weight: 500; color: #333333;
  text-decoration: none; border: none; background: transparent;
  cursor: pointer; width: 100%; transition: background 0.12s;
}
.nav-item:hover { background: #F7F7F7; }
.nav-item.active { background: #F0F0F0; }
.nav-item img { width: 24px; height: 24px; display: block; flex: none; }

/* ─────────────── Right Frame: fill ─────────────── */
.rf {
  flex: 1; min-width: 0; height: 100%;
  display: flex; flex-direction: column; gap: 12px;
  overflow: hidden;
}

/* Header of section: 64px */
.hdr { flex: none; height: 64px; display: flex; gap: 8px; }
.search-card {
  width: 316px; flex: none; height: 64px;
  background: #FFFFFF; border-radius: 24px;
  padding: 12px;
  display: flex; align-items: center;
}
.search-field {
  width: 292px; height: 40px;
  background: #F7F7F7; border-radius: 12px;
  padding: 10px 12px; gap: 8px;
  display: flex; align-items: center;
}
.search-field img { width: 16px; height: 16px; display: block; flex: none; }
.search-field input {
  flex: 1; border: none; outline: none; background: transparent;
  font-family: 'PT Root UI', sans-serif; font-size: 14px; font-weight: 500; color: #1F1F1F;
}
.filter-card {
  flex: 1; height: 64px;
  background: #FFFFFF; border-radius: 24px;
  padding: 12px 24px; gap: 32px;
  display: flex; align-items: center;
}
.pill-group { display: flex; gap: 4px; }
.pill {
  height: 22px; padding: 4px 8px; border-radius: 24px;
  border: none; background: transparent; color: #1F1F1F;
  font-family: 'PT Root UI', sans-serif; font-size: 12px; font-weight: 500; line-height: 1.4;
  cursor: pointer; transition: background 0.12s, color 0.12s; white-space: nowrap;
  display: flex; align-items: center;
}
.pill.active { background: #1A1A1A; color: #FFFFFF; }
.pill:not(.active):hover { background: #F7F7F7; }

/* Content Section */
.content-card {
  flex: 1; min-height: 0;
  background: #FFFFFF; border-radius: 24px;
  padding: 24px 28px;
  display: flex; flex-direction: column;
  overflow-y: auto; overflow-x: hidden;
}

/* Add-player bar */
.add-bar {
  flex: none; height: 72px;
  background: #FFFFFF; border-radius: 24px;
  display: flex; align-items: flex-start; justify-content: flex-start;
  padding: 12px;
}
.add-btn {
  display: inline-flex; align-items: center; gap: 4px;
  height: 48px; padding: 12px 24px 12px 17px;
  border: none; border-radius: 16px;
  background: #EDEDED; color: #1F1F1F;
  font-family: 'PT Root UI', sans-serif; font-size: 14px; font-weight: 600;
  cursor: pointer; text-decoration: none; transition: background 0.12s;
}
.add-btn:hover { background: #DDDDDD; }
.add-btn img { width: 16px; height: 16px; display: block; }

/* ─────────────── Tournament cards (unchanged) ─────────────── */
.section-label { font-size: 11px; font-weight: 600; color: #999999; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px; }
.active-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
.completed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.active-row { display: flex; gap: 12px; align-items: stretch; }
.completed-item { display: flex; flex-direction: column; gap: 8px; }

.tourn-card {
  border-radius: 24px; padding: 20px 24px;
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
}
.active-row .tourn-card { flex: 1; min-height: 160px; }
.completed-item .tourn-card { min-height: 140px; }

.tourn-card-body { flex: 1; display: flex; flex-direction: column; gap: 12px; }
.tourn-title { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
.tourn-card-meta { display: flex; flex-direction: column; gap: 7px; }
.meta-line { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; }
.meta-icon { display: flex; align-items: center; flex: none; line-height: 0; }
.meta-val { font-weight: 700; margin-left: 2px; }
.tourn-ball {
  position: absolute; right: -10px; bottom: -10px;
  width: 88px; height: 88px; object-fit: contain; pointer-events: none;
}

.action-card {
  background: #F7F7F7; border-radius: 24px; padding: 18px 20px;
  display: flex; flex-direction: column;
}
.active-row .action-card { flex: 0 0 180px; }
.spots-block { display: flex; flex-direction: column; gap: 3px; }
.spots-label { font-size: 11px; font-weight: 600; color: #999999; text-transform: uppercase; letter-spacing: 0.06em; }
.spots-val { font-size: 32px; font-weight: 700; color: #1F1F1F; line-height: 1; }
.action-btn {
  display: flex; align-items: center; justify-content: center;
  height: 44px; border: none; border-radius: 16px;
  font-family: inherit; font-size: 14px; font-weight: 600;
  text-decoration: none; cursor: pointer; transition: background 0.13s; margin-top: auto;
}
.action-btn.manage { background: #1A1A1A; color: #FFFFFF; }
.action-btn.manage:hover { background: #333333; }
.action-row { display: flex; gap: 8px; align-items: center; margin-top: auto; }
.action-btn.view { background: #1A1A1A; color: #FFFFFF; flex: 1; }
.action-btn.view:hover { background: #333333; }
.del-btn {
  flex: none; width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  background: #EDEDED; border: none; border-radius: 16px;
  cursor: pointer; transition: background 0.13s;
}
.del-btn:hover { background: #FDECEC; }
.del-btn img { width: 18px; height: 18px; display: block; }

.empty-state { background: #F7F7F7; border-radius: 16px; padding: 40px 28px; text-align: center; color: #AAAAAA; font-size: 14px; font-weight: 500; }

/* ─────────────── Delete modal (unchanged) ─────────────── */
.modal-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(20,20,20,0.42); display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay[hidden] { display: none; }
.modal { background: #FFFFFF; border-radius: 24px; padding: 28px 24px 24px; width: 360px; max-width: 100%; box-shadow: 0 8px 40px rgba(0,0,0,0.18); }
.modal h3 { margin: 0 0 8px; font-size: 20px; font-weight: 700; color: #1F1F1F; }
.modal p  { margin: 0 0 24px; font-size: 14px; line-height: 1.6; color: #666666; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions button { flex: 1; height: 48px; border: none; border-radius: 20px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
.modal-cancel { background: #F0F0F0; color: #1F1F1F; }
.modal-cancel:hover { background: #E6E6E6; }
.modal-danger { background: #F26B3A; color: #FFFFFF; }
.modal-danger:hover { background: #E05A2A; }
</style>
</head>
<body>
<div class="shell">

  <!-- ─── Left Frame (251px) ─── -->
  <div class="lf">
    <div class="logo-head">
      <img src="assets/logo-badge.svg" alt="TTCB" />
      <span class="logo-wordmark">TTCB Admin</span>
    </div>
    <div class="nav-panel">
      <nav>
        <a href="players.html" class="nav-item">
          <img src="assets/nav-icon-players.svg" alt="" />
          <span>Players</span>
        </a>
        <a href="tournaments.html" class="nav-item active">
          <img src="assets/nav-icon-tournaments.svg" alt="" />
          <span>Tournaments</span>
        </a>
      </nav>
    </div>
  </div>

  <!-- ─── Right Frame (fill) ─── -->
  <div class="rf">

    <!-- 1. Header: search + filter pills -->
    <div class="hdr">
      <div class="search-card">
        <div class="search-field">
          <img src="assets/icon-search.svg" alt="" />
          <input type="text" id="search" placeholder="Tournament search" autocomplete="off" />
        </div>
      </div>
      <div class="filter-card">
        <div class="pill-group" id="type-pills">
          <button class="pill active" data-type="all">All</button>
          <button class="pill" data-type="League Series">Series</button>
          <button class="pill" data-type="League Cup">Cup</button>
          <button class="pill" data-type="League Masters">Masters</button>
        </div>
        <div class="pill-group" id="status-pills">
          <button class="pill active" data-status="all">All</button>
          <button class="pill" data-status="active">Active</button>
          <button class="pill" data-status="completed">Completed</button>
        </div>
      </div>
    </div>

    <!-- 2. Content Section -->
    <div class="content-card">
      <div class="section-label" id="activeLabel">Active</div>
      <div class="active-list" id="activeList"></div>
      <div class="section-label" id="completedLabel">Completed</div>
      <div class="completed-grid" id="completedGrid"></div>
    </div>

    <!-- 3. Footer bar -->
    <div class="add-bar">
      <button class="add-btn" id="add-btn">
        <img src="assets/icon-plus.svg" alt="" />
        Add tournament
      </button>
    </div>

  </div>
</div>

<div class="modal-overlay" id="delete-modal" hidden>
  <div class="modal">
    <h3>Delete tournament?</h3>
    <p>This tournament will be permanently deleted.</p>
    <div class="modal-actions">
      <button class="modal-cancel" id="delete-cancel">Cancel</button>
      <button class="modal-danger" id="delete-confirm">Delete</button>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
  const STYLES = {
    'League Series':  { bg: '#F0F0F0', fg: '#1A1A1A', labelColor: '#999999', ball: 'assets/ball-series.png' },
    'League Cup':     { bg: '#1F1F1F', fg: '#FFFFFF',  labelColor: 'rgba(255,255,255,0.55)', ball: 'assets/ball-cup.png' },
    'League Masters': { bg: 'linear-gradient(135deg, #F74A96, #C3095B)', fg: '#FFFFFF', labelColor: 'rgba(255,255,255,0.7)', ball: 'assets/ball-masters.png' },
  };
  function styleFor(cat) { return STYLES[cat] || STYLES['League Series']; }

  const ICON_CAL = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M11.167 2.373V1.333a.5.5 0 0 0-1 0V2.333H5.833V1.333a.5.5 0 0 0-1 0v1.04C3.033 2.54 2.16 3.613 2.027 5.207a.353.353 0 0 0 .333.353H13.64a.353.353 0 0 0 .333-.353C13.84 3.613 12.967 2.54 11.167 2.373Z" fill="currentColor"/><path d="M13.333 6.56H2.667C2.3 6.56 2 6.86 2 7.227V11.333C2 13.333 3 14.667 5.333 14.667h5.334C13 14.667 14 13.333 14 11.333V7.227C14 6.86 13.7 6.56 13.333 6.56Z" fill="currentColor"/></svg>';
  const ICON_PPL = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M9 2C6.38 2 4.13 4.13 4.25 6.75c0 2.57 2.01 4.65 4.63 4.74H9.17C11.73 11.4 13.74 9.32 13.75 6.75 13.75 4.13 11.62 2 9 2Z" fill="currentColor"/><path d="M14.08 14.15C11.29 12.29 6.74 12.29 3.93 14.15A3.876 3.876 0 0 0 1.96 17.38c0 1.23.7 2.37 1.96 3.21C5.32 21.53 7.16 22 9 22s3.68-.47 5.08-1.41c1.26-.85 1.96-1.99 1.96-3.23-.01-1.23-.7-2.37-1.96-3.21Z" fill="currentColor"/><path d="M19.99 7.34c.16 1.94-1.22 3.64-3.13 3.87h-.23c-.97.05-1.86-.26-2.53-.83 1.03-.92 1.62-2.3 1.5-3.8a4.34 4.34 0 0 0-.69-2.15 3.748 3.748 0 0 1 4.08 2.89ZM21.99 16.59c-.08.97-.7 1.81-1.74 2.38-1 .55-2.26.81-3.51.78.72-.65 1.14-1.46 1.22-2.32.1-1.24-.49-2.43-1.67-3.38a8.857 8.857 0 0 0-2.29-1.26c2.21-.64 4.99-.21 6.7 1.17.92.74 1.39 1.67 1.29 2.63Z" fill="currentColor"/></svg>';

  let tournaments = [];
  let typeFilter = 'all', statusFilter = 'all';

  const searchEl       = document.getElementById('search');
  const activeLabel    = document.getElementById('activeLabel');
  const activeList     = document.getElementById('activeList');
  const completedLabel = document.getElementById('completedLabel');
  const completedGrid  = document.getElementById('completedGrid');

  function matchesSearch(t, q) {
    if (!q) return true;
    const date  = (t.date     || '').toLowerCase();
    const cat   = (t.category || '').toLowerCase();
    const count = String(t.players || t.filledPlayers || 0);
    return date.includes(q) || cat.includes(q) || count === q;
  }

  function buildCard(t, isActive) {
    const s = styleFor(t.category);
    const count = (!isActive && t.filledPlayers != null) ? t.filledPlayers : (t.players || 0);

    const card = document.createElement('div');
    card.className = 'tourn-card';
    card.style.background = s.bg;

    const body = document.createElement('div');
    body.className = 'tourn-card-body';

    const title = document.createElement('div');
    title.className = 'tourn-title';
    title.style.color = s.fg;
    title.textContent = t.category || 'League Series';

    const meta = document.createElement('div');
    meta.className = 'tourn-card-meta';
    meta.innerHTML =
      '<div class="meta-line">' +
        '<span class="meta-icon" style="color:' + s.labelColor + '">' + ICON_CAL + '</span>' +
        '<span class="meta-label" style="color:' + s.labelColor + '">Date</span>' +
        '<span class="meta-val" style="color:' + s.fg + '">' + (t.date || '—') + '</span>' +
      '</div>' +
      '<div class="meta-line">' +
        '<span class="meta-icon" style="color:' + s.labelColor + '">' + ICON_PPL + '</span>' +
        '<span class="meta-label" style="color:' + s.labelColor + '">Players</span>' +
        '<span class="meta-val" style="color:' + s.fg + '">' + count + '</span>' +
      '</div>';

    body.append(title, meta);

    const ball = document.createElement('img');
    ball.className = 'tourn-ball';
    ball.src = s.ball;
    ball.alt = '';

    card.append(body, ball);
    return card;
  }

  function buildActiveRow(t) {
    const row = document.createElement('div');
    row.className = 'active-row';

    const card = buildCard(t, true);

    const action = document.createElement('div');
    action.className = 'action-card';

    const freeSlots = t.freeSlots != null ? t.freeSlots : (t.players || 0);
    const spots = document.createElement('div');
    spots.className = 'spots-block';
    spots.innerHTML = '<div class="spots-label">Available spots</div><div class="spots-val">' + freeSlots + '</div>';
    action.appendChild(spots);

    const btn = document.createElement('a');
    btn.className = 'action-btn manage';
    btn.href = 'tournament.html';
    btn.textContent = 'Manage →';
    btn.addEventListener('click', () => API.setCurrentId(t.id));
    action.appendChild(btn);

    row.append(card, action);
    return row;
  }

  function buildCompletedItem(t) {
    const item = document.createElement('div');
    item.className = 'completed-item';

    const card = buildCard(t, false);

    const action = document.createElement('div');
    action.className = 'action-card';

    const actRow = document.createElement('div');
    actRow.className = 'action-row';

    const viewBtn = document.createElement('a');
    viewBtn.className = 'action-btn view';
    viewBtn.href = 'tournament.html?view=results';
    viewBtn.textContent = 'Results →';
    viewBtn.addEventListener('click', () => API.setCurrentId(t.id));

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'del-btn';
    delBtn.title = 'Delete';
    delBtn.innerHTML = '<img src="assets/icon-delete.svg" alt="" />';
    delBtn.addEventListener('click', () => askDelete(t.id));

    actRow.append(viewBtn, delBtn);
    action.appendChild(actRow);
    item.append(card, action);
    return item;
  }

  function render() {
    activeList.innerHTML = '';
    completedGrid.innerHTML = '';

    const q = searchEl.value.trim().toLowerCase();

    const filtered = tournaments.filter(t =>
      matchesSearch(t, q) &&
      (typeFilter === 'all' || t.category === typeFilter)
    );

    const active    = filtered.filter(t => t.status === 'current');
    const completed = filtered.filter(t => t.status !== 'current');

    const showActive    = statusFilter === 'all' || statusFilter === 'active';
    const showCompleted = statusFilter === 'all' || statusFilter === 'completed';

    activeLabel.style.display    = (showActive    && active.length)    ? '' : 'none';
    completedLabel.style.display = (showCompleted && completed.length) ? '' : 'none';

    const anyVisible = (showActive && active.length) || (showCompleted && completed.length);
    if (!anyVisible) {
      activeList.innerHTML = '<div class="empty-state">No tournaments match the current filters.</div>';
      return;
    }

    if (showActive)    active.forEach(t => activeList.appendChild(buildActiveRow(t)));
    if (showCompleted) completed.forEach(t => completedGrid.appendChild(buildCompletedItem(t)));
  }

  // Filter interactions
  document.getElementById('type-pills').addEventListener('click', e => {
    const btn = e.target.closest('.pill'); if (!btn) return;
    document.querySelectorAll('#type-pills .pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active'); typeFilter = btn.dataset.type; render();
  });
  document.getElementById('status-pills').addEventListener('click', e => {
    const btn = e.target.closest('.pill'); if (!btn) return;
    document.querySelectorAll('#status-pills .pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active'); statusFilter = btn.dataset.status; render();
  });
  searchEl.addEventListener('input', render);

  // Add tournament
  document.getElementById('add-btn').addEventListener('click', () => {
    API.setCurrentId('t' + Date.now());
    window.location.href = 'tournament.html';
  });

  // Delete modal
  const deleteModal = document.getElementById('delete-modal');
  let pendingDeleteId = null;
  function askDelete(id) { pendingDeleteId = id; deleteModal.hidden = false; }
  function closeDelete() { deleteModal.hidden = true; pendingDeleteId = null; }

  async function doDelete(id) {
    const state = await API.getTournamentState(id);
    if (state && state.preStats) {
      for (const [playerId, pre] of Object.entries(state.preStats)) {
        const p = await API.getPlayer(playerId);
        if (p) await API.savePlayer(Object.assign({}, p, { rating: pre.rating, trend: pre.trend, won: pre.won, lost: pre.lost, tournaments: pre.tournaments }));
      }
    }
    await fetch('/api/tournaments/' + encodeURIComponent(id), { method: 'DELETE' });
    tournaments = tournaments.filter(t => t && t.id !== id);
    render();
  }

  document.getElementById('delete-cancel').addEventListener('click', closeDelete);
  document.getElementById('delete-confirm').addEventListener('click', () => { if (pendingDeleteId) doDelete(pendingDeleteId); closeDelete(); });
  deleteModal.addEventListener('click', e => { if (e.target === deleteModal) closeDelete(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !deleteModal.hidden) closeDelete(); });

  API.getTournaments()
    .then(data => { tournaments = data; render(); })
    .catch(() => { activeList.innerHTML = '<div class="empty-state">Error loading data.</div>'; });
</script>
</body>
</html>
