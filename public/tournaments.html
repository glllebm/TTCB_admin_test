<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" href="assets/Logo.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Tournaments — TTCB Admin</title>
<link rel="stylesheet" href="assets/colors.css"/>
<style>
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_light.woff2') format('woff2'),url('assets/fonts/pt-root-ui_light.woff') format('woff');font-weight:300;}
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_regular.woff2') format('woff2'),url('assets/fonts/pt-root-ui_regular.woff') format('woff');font-weight:400;}
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_medium.woff2') format('woff2'),url('assets/fonts/pt-root-ui_medium.woff') format('woff');font-weight:500;}
@font-face{font-family:'PT Root UI';src:url('assets/fonts/pt-root-ui_bold.woff2') format('woff2'),url('assets/fonts/pt-root-ui_bold.woff') format('woff');font-weight:700;}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; background: var(--gray-5); font-family: 'PT Root UI', sans-serif; -webkit-font-smoothing: antialiased; }
input::placeholder { color: var(--gray-40); }

/* ─────────────── Shell ─────────────── */
.shell {
  height: 100vh; width: 100%; max-width: 100vw;
  padding: 12px; gap: 12px;
  display: flex; align-items: flex-start;
  overflow: hidden; box-sizing: border-box;
}

/* ─────────────── Left Frame: 251px ─────────────── */
.lf {
  width: 251px; flex: none;
  height: 100%;
  display: flex; flex-direction: column; gap: 12px;
}
.logo-head {
  width: 251px; height: 64px; flex: none;
  background: var(--white); border-radius: 24px;
  padding: 12px 24px;
  display: flex; align-items: center; gap: 12px;
}
.logo-head img { width: 32px; height: 32px; display: block; flex: none; }
.logo-wordmark { font-size: 20px; font-weight: 700; color: var(--gray-90); white-space: nowrap; }
.nav-panel {
  flex: 1;
  background: var(--white); border-radius: 24px;
  padding: 12px;
  display: flex; flex-direction: column;
  min-height: 0;
}
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 12px;
  font-family: 'PT Root UI', sans-serif; font-size: 16px; font-weight: 500; color: var(--gray-80);
  text-decoration: none; border: none; background: transparent;
  cursor: pointer; width: 100%; transition: background 0.12s;
}
.nav-item:hover { background: var(--gray-5); }
.nav-item.active { background: var(--gray-10); }
.nav-item img { width: 24px; height: 24px; display: block; flex: none; }

/* ─────────────── Right Frame: fill ─────────────── */
.rf {
  flex: 1; min-width: 0; height: 100%;
  display: flex; flex-direction: column; gap: 12px;
  overflow: hidden;
}

/* Header of section: 64px */
.hdr { flex: none; height: 64px; display: flex; gap: 8px; }
.search-card {
  width: 316px; flex: none; height: 64px;
  background: var(--white); border-radius: 24px;
  padding: 12px;
  display: flex; align-items: center;
}
.search-field {
  width: 292px; height: 40px;
  background: var(--gray-5); border-radius: 12px;
  padding: 10px 12px; gap: 8px;
  display: flex; align-items: center;
}
.search-field img { width: 16px; height: 16px; display: block; flex: none; }
.search-field input {
  flex: 1; border: none; outline: none; background: transparent;
  font-family: 'PT Root UI', sans-serif; font-size: 14px; font-weight: 500; color: var(--gray-90);
}
.filter-card {
  flex: 1; height: 64px;
  background: var(--white); border-radius: 24px;
  padding: 12px 24px; gap: 32px;
  display: flex; align-items: center;
}
.pill-group { display: flex; gap: 4px; }
.pill {
  height: 22px; padding: 4px 8px; border-radius: 24px;
  border: none; background: transparent; color: var(--gray-90);
  font-family: 'PT Root UI', sans-serif; font-size: 12px; font-weight: 500; line-height: 1.4;
  cursor: pointer; transition: background 0.12s, color 0.12s; white-space: nowrap;
  display: flex; align-items: center;
}
.pill.active { background: var(--black); color: var(--white); }
.pill:not(.active):hover { background: var(--gray-5); }

/* Content Section: 12px padding, 48px gap between Active and Completed groups */
.content-card {
  flex: 1; min-height: 0;
  background: var(--white); border-radius: 24px;
  padding: 12px;
  display: flex; flex-direction: column; gap: 48px;
  overflow-y: auto; overflow-x: hidden;
}

/* Add-player bar */
.add-bar {
  flex: none; height: 72px;
  background: var(--white); border-radius: 24px;
  display: flex; align-items: flex-start; justify-content: flex-start;
  padding: 12px;
}
.add-btn {
  display: inline-flex; align-items: center; gap: 4px;
  height: 48px; padding: 12px 24px 12px 17px;
  border: none; border-radius: 16px;
  background: var(--gray-10); color: var(--gray-90);
  font-family: 'PT Root UI', sans-serif; font-size: 14px; font-weight: 600;
  cursor: pointer; text-decoration: none; transition: background 0.12s;
}
.add-btn:hover { background: #DDDDDD; }
.add-btn img { width: 16px; height: 16px; display: block; }

/* ─────────────── Tournament cards ─────────────── */

/* Section wrapper: divider bar + card row, 24px gap */
.tc-section { display: flex; flex-direction: column; gap: 24px; width: 100%; }

/* Divider bar: Gray 5 pill, H4 Bold label, uniform 8px padding, 8px icon gap */
.tc-divider {
  width: 100%; height: 38px;
  background: var(--gray-5); border-radius: 12px;
  padding: 8px; gap: 8px;
  display: flex; align-items: center;
  font-family: 'PT Root UI', sans-serif; font-size: 14px; font-weight: 700;
  line-height: 1.2; color: var(--gray-90);
  box-sizing: border-box;
}
/* Icon colors: Active = app pink, Completed = Gray 80 */
.tc-divider--active   img { filter: brightness(0) saturate(100%) invert(37%) sepia(100%) saturate(3000%) hue-rotate(293deg) brightness(105%); }
.tc-divider--completed img { filter: brightness(0) invert(20%); }

.active-list,
.completed-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }

/* Card outer: 270px fixed, category fill, 8px padding, 12px gap */
/* Outer card: always Gray 10 fill, no border; fills its 1fr grid column */
.tc {
  width: 100%;
  background: var(--gray-10);
  display: flex; flex-direction: column; align-items: flex-start;
  padding: 8px; gap: 12px;
  border-radius: 24px; box-sizing: border-box;
}

/* Content frame (254px = card minus 8px padding each side) */
.tc-content { width: 100%; display: flex; flex-direction: column; gap: 4px; }

/* Inner info card: category fill applied via inline style; ball positioned inside */
.tc-info {
  width: 100%; height: 130px; box-sizing: border-box;
  background: var(--white); border-radius: 16px;
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
}
/* Inner wrapper carries the 16px padding so .tc-ball's right:0/bottom:0
   resolves against the unpadded .tc-info box — flush with the card edge */
.tc-info-inner {
  display: flex; flex-direction: column;
  justify-content: space-between; align-items: flex-start;
  padding: 16px; flex: 1;
}
.tc-head { display: flex; align-items: center; gap: 12px; }
.tc-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.tc-meta { display: flex; flex-direction: column; gap: 12px; }
/* icon-to-label gap: 4px; label-to-value gap: 4px gap + 8px margin = 12px */
.tc-meta-row { display: flex; align-items: center; gap: 4px; }
.tc-meta-row img { width: 16px; height: 16px; display: block; flex: none; filter: brightness(5); }
/* Dark-background inner card: white icons */
.tc-info.dark .tc-meta-row img { filter: brightness(0) invert(1); }
.tc-lbl { font-size: 12px; font-weight: 500; line-height: 1.4; }
.tc-val { font-size: 12px; font-weight: 500; line-height: 1.4; margin-left: 8px; }
/* Ball image inside inner card: 103px, flush with corner */
.tc-ball {
  position: absolute; right: -32px; bottom: -32px;
  width: 140px; height: 140px; object-fit: contain; pointer-events: none;
}
/* Available spots block: always white bg, always Gray 90 icon/label/value */
.tc-spots .tc-meta-row img { filter: none; }
.tc-spots .tc-lbl { color: var(--black) !important; }

/* Available spots block: Active only, always white, 49px tall */
.tc-spots {
  width: 100%; height: 49px; box-sizing: border-box;
  background: var(--white); border-radius: 16px;
  padding: 16px;
  display: flex; align-items: center;
}

/* Main button: 48px tall, fills card width (254px) */
.tc-btn {
  width: 100%; height: 48px; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center;
  padding: 8px 20px 8px 24px; gap: 6px;
  border-radius: 16px; border: none;
  font-family: 'PT Root UI', sans-serif; font-size: 14px; font-weight: 600;
  text-decoration: none; cursor: pointer; transition: background 0.13s;
}
.tc-btn img { width: 16px; height: 16px; display: block; flex: none; filter: brightness(0) invert(1); }
/* Active: dark fill, white text/arrow */
.tc-btn.manage { background: var(--black); color: var(--white); }
.tc-btn.manage:hover { background: var(--gray-80); }
/* Completed: white fill, dark text/arrow */
.tc-btn.view { background: var(--white); color: var(--black); border: 1px solid var(--gray-10); }
.tc-btn.view:hover { background: var(--gray-5); }
.tc-btn.view img { filter: none; }

.empty-state { background: var(--gray-5); border-radius: 16px; padding: 40px 28px; text-align: center; color: #AAAAAA; font-size: 14px; font-weight: 500; }
</style>
</head>
<body>
<div class="shell">

  <!-- ─── Left Frame (251px) ─── -->
  <div class="lf">
    <div class="logo-head">
      <img src="assets/logo-badge.svg" alt="TTCB" />
      <span class="logo-wordmark">TTCB Admin</span>
    </div>
    <div class="nav-panel">
      <nav>
        <a href="players.html" class="nav-item">
          <img src="assets/Ic-24-Players-Filled.svg" alt="" />
          <span>Players</span>
        </a>
        <a href="tournaments.html" class="nav-item active">
          <img src="assets/Ic-24px-Tournaments-Filled.svg" alt="" />
          <span>Tournaments</span>
        </a>
      </nav>
    </div>
  </div>

  <!-- ─── Right Frame (fill) ─── -->
  <div class="rf">

    <!-- 1. Header: search + filter pills -->
    <div class="hdr">
      <div class="search-card">
        <div class="search-field">
          <img src="assets/Ic-16px-Search-Stroke.svg" alt="" />
          <input type="text" id="search" placeholder="Tournament search" autocomplete="off" />
        </div>
      </div>
      <div class="filter-card">
        <div class="pill-group" id="type-pills">
          <button class="pill active" data-type="all">All</button>
          <button class="pill" data-type="League Series">Series</button>
          <button class="pill" data-type="League Cup">Cup</button>
          <button class="pill" data-type="League Masters">Masters</button>
        </div>
        <div class="pill-group" id="status-pills">
          <button class="pill active" data-status="all">All</button>
          <button class="pill" data-status="active">Active</button>
          <button class="pill" data-status="completed">Completed</button>
        </div>
      </div>
    </div>

    <!-- 2. Content Section -->
    <div class="content-card">
      <div class="tc-section" id="activeLabel">
        <div class="tc-divider tc-divider--active"><img src="assets/Ic-24-Active-Filled.svg" width="16" height="16" alt=""/>Active tournaments</div>
        <div class="active-list" id="activeList"></div>
      </div>
      <div class="tc-section" id="completedLabel">
        <div class="tc-divider tc-divider--completed"><img src="assets/Ic-24-Completed-Filled.svg" width="16" height="16" alt=""/>Completed tournaments</div>
        <div class="completed-grid" id="completedGrid"></div>
      </div>
    </div>

    <!-- 3. Footer bar -->
    <div class="add-bar">
      <button class="add-btn" id="add-btn">
        <img src="assets/Ic-16px-plus-Filled.svg" alt="" />
        Add tournament
      </button>
    </div>

  </div>
</div>

<script src="api.js"></script>
<script src="nav.js"></script>
<script>
  const STYLES = {
    'League Series':  { bg: 'var(--white)', fg: 'var(--black)', labelColor: 'var(--gray-40)', ball: 'assets/img-series.png?v=3', dark: false },
    'League Cup':     { bg: 'var(--gray-90)', fg: 'var(--white)', labelColor: 'var(--white)', ball: 'assets/img-cup.png?v=3',    dark: true  },
    'League Masters': { bg: 'linear-gradient(135deg, var(--pink-40), #C3095B)', fg: 'var(--white)', labelColor: 'var(--white)', ball: 'assets/img-masters.png?v=3', dark: true  },
  };
  function styleFor(cat) { return STYLES[cat] || STYLES['League Series']; }

  const ICON_ARR = '<img src="assets/icon-arrow.svg" alt="" width="16" height="16" />';

  let tournaments = [];
  let typeFilter = 'all', statusFilter = 'all';

  const searchEl       = document.getElementById('search');
  const activeLabel    = document.getElementById('activeLabel');
  const activeList     = document.getElementById('activeList');
  const completedLabel = document.getElementById('completedLabel');
  const completedGrid  = document.getElementById('completedGrid');

  function matchesSearch(t, q) {
    if (!q) return true;
    const date  = (t.date     || '').toLowerCase();
    const cat   = (t.category || '').toLowerCase();
    const count = String(t.players || t.filledPlayers || 0);
    return date.includes(q) || cat.includes(q) || count === q;
  }

  function buildCard(t, isActive) {
    const s          = styleFor(t.category);
    const freeSlots  = t.freeSlots != null ? t.freeSlots : (t.players || 0);
    const playersVal = isActive
      ? 'up to ' + (t.players || 0)
      : (t.filledPlayers != null ? t.filledPlayers : (t.players || 0));

    // ── Outer card wrapper: always Gray 10 (set via CSS) ──
    const card = document.createElement('div');
    card.className = 'tc';

    // ── Content frame ──
    const content = document.createElement('div');
    content.className = 'tc-content';

    // ── Inner info card: receives category background + dark flag ──
    const info = document.createElement('div');
    info.className = 'tc-info' + (s.dark ? ' dark' : '');
    info.style.background = s.bg;

    const head = document.createElement('div');
    head.className = 'tc-head';
    const titleEl = document.createElement('span');
    titleEl.className = 'tc-title';
    titleEl.style.color = s.fg;
    titleEl.textContent = t.category || 'League Series';
    head.appendChild(titleEl);

    const meta = document.createElement('div');
    meta.className = 'tc-meta';

    const dateRow = document.createElement('div');
    dateRow.className = 'tc-meta-row';
    dateRow.innerHTML =
      '<img src="assets/Ic-16px-Calendar-Filled.svg" alt="" />' +
      '<span class="tc-lbl" style="color:' + s.labelColor + '">Date</span>' +
      '<span class="tc-val" style="color:' + s.fg + '">' + (t.date || '—') + '</span>';

    const pplRow = document.createElement('div');
    pplRow.className = 'tc-meta-row';
    pplRow.innerHTML =
      '<img src="assets/Ic-24-Players-Filled.svg" alt="" />' +
      '<span class="tc-lbl" style="color:' + s.labelColor + '">Players</span>' +
      '<span class="tc-val" style="color:' + s.fg + '">' + playersVal + '</span>';

    meta.append(dateRow, pplRow);

    // Inner wrapper: carries the 16px padding (head + meta)
    const infoInner = document.createElement('div');
    infoInner.className = 'tc-info-inner';
    infoInner.append(head, meta);

    // Ball: sibling of infoInner, not inside it — so right:0/bottom:0
    // resolves against unpadded .tc-info, placing it flush with the card edge
    const ball = document.createElement('img');
    ball.className = 'tc-ball';
    ball.src = s.ball;
    ball.alt = '';

    info.append(infoInner, ball);
    content.appendChild(info);

    // ── Available spots (Active only, always on white block) ──
    if (isActive) {
      const spots = document.createElement('div');
      spots.className = 'tc-spots';
      spots.innerHTML =
        '<div class="tc-meta-row">' +
          '<img src="assets/Ic-24px-Player-Filled.svg" alt="" />' +
          '<span class="tc-lbl" style="color:var(--gray-40)">Available spots</span>' +
          '<span class="tc-val" style="color:var(--black)">' + freeSlots + '</span>' +
        '</div>';
      content.appendChild(spots);
    }

    card.appendChild(content);

    // ── Button ──
    if (isActive) {
      const btn = document.createElement('a');
      btn.className = 'tc-btn manage';
      btn.href = 'tournament.html';
      btn.innerHTML = 'Manage tournament' + ICON_ARR;
      btn.addEventListener('click', () => API.setCurrentId(t.id));
      card.appendChild(btn);
    } else {
      const viewBtn = document.createElement('a');
      viewBtn.className = 'tc-btn view';
      viewBtn.href = 'tournament.html?view=results';
      viewBtn.innerHTML = 'View tournament' + ICON_ARR;
      viewBtn.addEventListener('click', () => API.setCurrentId(t.id));
      card.appendChild(viewBtn);
    }

    return card;
  }

  function buildActiveRow(t)     { return buildCard(t, true);  }
  function buildCompletedItem(t) { return buildCard(t, false); }

  function render() {
    activeList.innerHTML = '';
    completedGrid.innerHTML = '';

    const q = searchEl.value.trim().toLowerCase();

    const filtered = tournaments.filter(t =>
      matchesSearch(t, q) &&
      (typeFilter === 'all' || t.category === typeFilter)
    );

    const active    = filtered.filter(t => t.status === 'current');
    const completed = filtered.filter(t => t.status !== 'current');

    const showActive    = statusFilter === 'all' || statusFilter === 'active';
    const showCompleted = statusFilter === 'all' || statusFilter === 'completed';

    const anyVisible = (showActive && active.length) || (showCompleted && completed.length);
    if (!anyVisible) {
      activeLabel.style.display    = '';
      completedLabel.style.display = 'none';
      activeList.innerHTML = '<div class="empty-state">No tournaments match the current filters.</div>';
      return;
    }

    activeLabel.style.display    = (showActive    && active.length)    ? '' : 'none';
    completedLabel.style.display = (showCompleted && completed.length) ? '' : 'none';

    if (showActive)    active.forEach(t => activeList.appendChild(buildActiveRow(t)));
    if (showCompleted) completed.forEach(t => completedGrid.appendChild(buildCompletedItem(t)));
  }

  // Filter interactions
  document.getElementById('type-pills').addEventListener('click', e => {
    const btn = e.target.closest('.pill'); if (!btn) return;
    document.querySelectorAll('#type-pills .pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active'); typeFilter = btn.dataset.type; render();
  });
  document.getElementById('status-pills').addEventListener('click', e => {
    const btn = e.target.closest('.pill'); if (!btn) return;
    document.querySelectorAll('#status-pills .pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active'); statusFilter = btn.dataset.status; render();
  });
  searchEl.addEventListener('input', render);

  // Add tournament
  document.getElementById('add-btn').addEventListener('click', () => {
    API.setCurrentId('t' + Date.now());
    window.location.href = 'tournament.html';
  });

  API.getTournaments()
    .then(data => { tournaments = data; render(); })
    .catch(() => { activeList.innerHTML = '<div class="empty-state">Error loading data.</div>'; });
</script>
</body>
</html>
